# F02: CI/CD — Build and test on every push
name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make pkg-config libcurl4-openssl-dev libjansson-dev libsqlite3-dev valgrind

      - name: Build engine
        run: |
          cd engine
          make all 2>&1 | tail -20

      - name: Build tools
        run: |
          cd engine
          make tools 2>&1 | tail -10

      - name: Run tests
        run: |
          cd engine
          make test 2>&1 | tail -20

      - name: Memory check (room_engine)
        run: |
          cd engine
          make memcheck 2>&1 | tail -10

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: engine/room_engine*
