# Money Room - Secure Reverse Proxy (User-space nginx)
# Upstream: C data_server on localhost:9091

worker_processes auto;
error_log /home/wubu2/money-room/nginx/error.log warn;
pid /home/wubu2/money-room/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /home/wubu2/money-room/nginx/access.log main;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=static:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json;

    # Upstream backend
    upstream moneyroom_backend {
        server localhost:9091;
        keepalive 32;
    }

    server {
        listen 8443 ssl http2;
        listen [::]:8443 ssl http2;
        server_name localhost;
        root /home/wubu2/money-room/docs;

        # SSL
        ssl_certificate /home/wubu2/money-room/nginx/ssl/moneyroom.crt;
        ssl_certificate_key /home/wubu2/money-room/nginx/ssl/moneyroom.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self';" always;

        # Basic auth for all endpoints
        auth_basic "Money Room";
        auth_basic_user_file /home/wubu2/money-room/nginx/.htpasswd;

        # Static files - high rate limit
        location ~* \.(css|js|ico|svg|woff2?|png|jpg|jpeg|gif|webp)$ {
            limit_req zone=static burst=200 nodelay;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # HTML pages - moderate rate limit
        location ~* \.html$ {
            limit_req zone=static burst=50 nodelay;
            try_files $uri =404;
        }

        # API endpoints - strict rate limit
        location /data/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://moneyroom_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 30s;
        }

        # Register endpoint - strict auth rate limit
        location /register {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://moneyroom_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 30s;
        }

        # Health check (no auth)
        location /health {
            auth_basic off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Root redirect to index.html
        location = / {
            return 302 /index.html;
        }

        # Deny access to sensitive files
        location ~ /\.(git|env|htaccess|htpasswd) {
            deny all;
        }
        location ~ \.(sh|py|conf|log)$ {
            deny all;
        }
    }

    # HTTP redirect to HTTPS
    server {
        listen 8080;
        listen [::]:8080;
        server_name localhost;
        return 301 https://$host:8443$request_uri;
    }
}