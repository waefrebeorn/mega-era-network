<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Live system status for Money Room — health of collectors, engine, data pipeline.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>System Status — Money Room</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.status-row{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}.status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}.up{background:var(--green)}.down{background:var(--red)}.degraded{background:var(--orange)}.offline{background:var(--text-quaternary)}
</style>
</head>
<body>
<nav>
  <div class="container">
    <a href="." class="logo"><span class="dot"></span> Money <span>Room</span></a>
    <div class="nav-links">
      <a href=".">Live</a>
      <a href="live.html">Dashboard</a>
      <a href="dashboard.html" style="color:var(--orange);font-weight:500">Pipeline</a>
      <a href="pricing.html">Pricing</a>
      <a href="https://github.com/waefrebeorn/money-room" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="register.html" style="background:transparent;color:var(--accent);border:1px solid var(--accent);padding:6px 16px;border-radius:8px;font-size:12px;font-weight:600">Get&nbsp;Key</a>
    </div>
  </div>
</nav>
<div class="page-header">
  <div class="container">
    <h1>🔵 System Status</h1>
    <p>Live health of all Money Room components</p>
  </div>
</div>
<section style="padding-bottom:60px">
  <div class="container" style="max-width:600px" id="statusBody">
    <p style="color:var(--text-tertiary)">Loading status...</p>
  </div>
</section>
<footer class="footer">
  <div class="container">
    <div class="bottom"><span>© 2026 Money Room</span> · <a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a> · <a href="contact.html">Contact</a> · <a href="https://github.com/waefrebeorn/money-room">GitHub</a></div>
  </div>
</footer>
<script src="data_fetcher.js"></script>
<script>
window.DATA_FETCHER.fetchPipeline(function(err, d){
  var sb = document.getElementById('statusBody');
  if (err || !d || !d.components) {
    sb.innerHTML = '<p style="color:var(--red)">Could not load status data. <a href="." style="color:var(--accent)">Back to homepage</a></p>';
    return;
  }
  var h = '';
  var ok = 0, total = 0;
  h += '<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px">';
  h += '<div class="status-row" style="font-weight:600;border-bottom:2px solid var(--border)"><span>Component</span><span>Status</span></div>';
  for (var k in d.components) {
    var c = d.components[k];
    var dot = c.ok ? 'up' : (c.warn ? 'degraded' : 'down');
    if (c.ok) ok++;
    total++;
    h += '<div class="status-row"><span>' + k + '</span><span><span class="status-dot ' + dot + '"></span>' +
      (c.ok ? 'Operational' : (c.warn ? 'Degraded' : 'Down')) + '</span></div>';
  }
  h += '</div>';
  h += '<div style="margin-top:12px;text-align:center;font-size:13px;color:var(--text-tertiary)">' +
    ok + '/' + total + ' components operational</div>';
  sb.innerHTML = h;
});
</script>
</body>
</html>
